# build OpenWrt for rk3399-am40 via Image Builder
name: RK3399-AM40 OpenWrt Builder 

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs: 
      openwrt_version:
        description: OpenWrt Version (e.g. 24.10.1)
        default: "24.10.1"
        required: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: build image via docker container
        run: |
             cd ${{ github.workspace }}
             mkdir output
             docker run --user root \
             -e openwrtver=$OPENWRT_VERSION \
             -v ./input:/input -v ./output:/output -v ./mkimg.sh:/mkimg.sh \
             ghcr.io/openwrt/imagebuilder:rockchip-armv8-$OPENWRT_VERSION \
             /bin/bash /mkimg.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-rk3399-am40
          overwrite: true
          retention-days: 5
          compression-level: 0
          path: ${{ github.workspace }}/output/*
